# =============================================================================
# Checkin CD — Build Image & Deploy to Cloud Run
#
# Triggered automatically when the "Checkin CI" workflow succeeds on main.
# Requires: prerequisites workflow must have run at least once beforehand.
#
# Cloud Run env vars point to the GCE VM for Couchbase and OTel Collector,
# and to the Passengers Cloud Run service for inter-service communication.
# =============================================================================

name: Checkin CD

on:
  workflow_run:
    workflows: ["Checkin CI"]
    types: [completed]
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: checkin-service
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  IMAGE_NAME: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/actividad-2-2/checkin

jobs:
  # ── Job 1: Build and push Docker image ──────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # Only proceed if the CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ── 2. Authenticate with GCP via Workload Identity Federation ───────────
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ── 3. Setup gcloud CLI ────────────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ── 4. Login to Artifact Registry ─────────────────────────────────────
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      # ── 5. Set image tag ───────────────────────────────────────────────────
      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image will be tagged: ${{ env.IMAGE_NAME }}:${SHORT_SHA}"

      # ── 6. Build and push Docker image ─────────────────────────────────────
      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.image_tag }}

          docker build \
            -t ${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ./Checkin

          docker push ${{ env.IMAGE_NAME }}:${IMAGE_TAG}
          docker push ${{ env.IMAGE_NAME }}:latest

          echo "Pushed: ${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

  # ── Job 2: Deploy to Cloud Run ───────────────────────────────────────────────
  deploy-cloud-run:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # ── 1. Authenticate with GCP ───────────────────────────────────────────
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ── 2. Setup gcloud CLI ────────────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # ── 3. Deploy to Cloud Run ─────────────────────────────────────────────
      # Env vars override appsettings.json. Couchbase and OTel point to GCE VM.
      # PassengersUrl points to the Cloud Run Passengers service.
      - name: Deploy Checkin to Cloud Run
        run: |
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="
              Couchbase__ConnectionString=couchbase://${{ secrets.GCE_VM_EXTERNAL_IP }},
              Couchbase__Username=${{ secrets.CB_ADMIN_USER }},
              Couchbase__Password=${{ secrets.CB_ADMIN_PASSWORD }},
              Services__PassengersUrl=${{ secrets.PASSENGERS_SERVICE_URL }},
              OpenTelemetry__OtlpEndpoint=http://${{ secrets.GCE_VM_EXTERNAL_IP }}:4317,
              OTEL_EXPORTER_OTLP_ENDPOINT=http://${{ secrets.GCE_VM_EXTERNAL_IP }}:4317
            " \
            --quiet

      # ── 4. Print deployed service URL ─────────────────────────────────────
      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "✅ Checkin service deployed: ${SERVICE_URL}"
          echo "SERVICE_URL=${SERVICE_URL}" >> $GITHUB_STEP_SUMMARY

      # ── 5. Smoke test ──────────────────────────────────────────────────────
      - name: Smoke test — health check
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')

          echo "Checking ${SERVICE_URL}/health ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/health" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP ${HTTP_STATUS})"
          else
            echo "⚠️ Health check returned HTTP ${HTTP_STATUS} — service may still be starting"
          fi
