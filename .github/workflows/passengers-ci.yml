# =============================================================================
# Passengers CI — Build & Test
#
# Triggers on push or PR to main when Passengers source or test files change.
# CD workflow depends on successful completion of this workflow.
# =============================================================================

name: Passengers CI

on:
  push:
    branches: [main]
    paths:
      - 'Passengers/**'
      - 'Passengers.Tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'Passengers/**'
      - 'Passengers.Tests/**'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Passengers Service
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Setup .NET 10 ─────────────────────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── 3. Restore dependencies ───────────────────────────────────────────────
      - name: Restore dependencies
        run: |
          dotnet restore Passengers/Passengers.csproj
          dotnet restore Passengers.Tests/Passengers.Tests.csproj

      # ── 4. Build ─────────────────────────────────────────────────────────────
      - name: Build solution and tests
        run: |
          dotnet build Passengers/Passengers.csproj --no-restore -c Release
          dotnet build Passengers.Tests/Passengers.Tests.csproj --no-restore -c Release

      # ── 5. Run unit tests ────────────────────────────────────────────────────
      - name: Run unit tests
        run: dotnet test Passengers.Tests/Passengers.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results

      # ── 6. Upload test results (optional, visible in Actions UI) ─────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passengers-test-results
          path: test-results/
          retention-days: 7
