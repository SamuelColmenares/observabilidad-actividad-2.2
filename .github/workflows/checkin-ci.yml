# =============================================================================
# Checkin CI — Build & Test
#
# Triggers on push or PR to main when Checkin source files change.
# CD workflow depends on successful completion of this workflow.
# =============================================================================

name: Checkin CI

on:
  push:
    branches: [main]
    paths:
      - 'Checkin/**'
  pull_request:
    branches: [main]
    paths:
      - 'Checkin/**'

jobs:
  build-and-test:
    name: Build and Test Checkin Service
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Setup .NET 10 ─────────────────────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # ── 3. Restore dependencies ───────────────────────────────────────────────
      - name: Restore dependencies
        run: dotnet restore Checkin/Checkin.csproj

      # ── 4. Build ─────────────────────────────────────────────────────────────
      - name: Build solution
        run: dotnet build Checkin/Checkin.csproj --no-restore -c Release

      # ── 5. Run unit tests ────────────────────────────────────────────────────
      # Discovers any *Tests.csproj projects inside the Checkin/ directory tree.
      - name: Run unit tests
        run: |
          TEST_PROJECTS=$(find Checkin -name '*Tests.csproj' -o -name '*Test.csproj' 2>/dev/null)
          if [ -n "$TEST_PROJECTS" ]; then
            echo "$TEST_PROJECTS" | xargs -I{} dotnet test {} --no-build -c Release --logger "trx;LogFileName=test-results.trx" --results-directory ./test-results
          else
            echo "No test projects found in Checkin/. Skipping test step."
          fi

      # ── 6. Upload test results (optional, visible in Actions UI) ─────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkin-test-results
          path: test-results/
          retention-days: 7
